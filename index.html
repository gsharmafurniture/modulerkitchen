<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>L-Shaped Modular Kitchen 3D</title>
  <style>
    :root {
      --bg: #e9e6df;
      --ink: #23211e;
      --panel: #fbfaf7;
      --line: #c9c4b8;
      --acc: #3b5b6b;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #1d1f21;
        --ink: #ece8e0;
        --panel: #2a2c2f;
        --line: #45484c;
        --acc: #8fb4c6
      }
    }

    :root[data-theme="dark"] {
      --bg: #1d1f21;
      --ink: #ece8e0;
      --panel: #2a2c2f;
      --line: #45484c;
      --acc: #8fb4c6
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      overflow: hidden
    }

    canvas {
      display: block
    }

    #ui {
      position: fixed;
      left: 12px;
      top: calc(12px + env(safe-area-inset-top, 0px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      max-width: 260px
    }

    #ui h1 {
      font-size: 15px;
      margin: 0 0 2px;
      font-weight: 600
    }

    #ui p {
      font-size: 12px;
      margin: 0 0 8px;
      opacity: .75;
      line-height: 1.4
    }

    #ui button {
      font: inherit;
      font-size: 12px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 5px 9px;
      margin: 0 4px 4px 0;
      cursor: pointer
    }

    #ui button:hover,
    #ui button.on {
      border-color: var(--acc);
      color: var(--acc)
    }

    #sw button {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      padding: 0;
      margin: 0 6px 0 0;
      border: 2px solid var(--line)
    }

    #sw button.on {
      border-color: var(--acc);
      box-shadow: 0 0 0 2px var(--acc)
    }
  </style>
</head>

<body>
  <div id="ui">
    <h1>L-shaped modular kitchen</h1>
    <p>Drag to orbit, scroll to zoom, right-drag to pan. All sizes in inches.</p>
    <button data-v="persp">3D view</button><button data-v="top">Top plan</button><button
      data-v="front">Front</button><button data-v="side">Side</button><br>
    <button id="spin">Auto-rotate</button><button id="dims" class="on">Dimensions</button>
    <p style="margin:8px 0 4px">Cabinet colour</p>
    <div id="sw"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(dark ? 0x1d1f21 : 0xe9e6df);
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(58, 16, 52);
    controls.maxPolarAngle = Math.PI / 2;

    // lights
    scene.add(new THREE.HemisphereLight(0xffffff, 0x888078, 0.75));
    const sun = new THREE.DirectionalLight(0xffffff, 0.8);
    sun.position.set(-80, 160, 120);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -180, right: 180, top: 180, bottom: -180, near: 1, far: 600 });
    scene.add(sun);

    // floor
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: dark ? 0x2b2d30 : 0xd8d3c8, roughness: 1 }));
    floor.rotation.x = -Math.PI / 2; floor.position.set(42, -0.05, 36); floor.receiveShadow = true;
    scene.add(floor);
    const grid = new THREE.GridHelper(400, 100, 0x888888, 0x999999);
    grid.material.opacity = .25; grid.material.transparent = true; grid.position.set(42, 0, 36);
    scene.add(grid);

    // materials
    const M = {
      cab: new THREE.MeshStandardMaterial({ color: 0x8c8578, roughness: .7 }),
      door: new THREE.MeshStandardMaterial({ color: 0x9a9386, roughness: .65 }),
      panel: new THREE.MeshStandardMaterial({ color: 0x867f72, roughness: .7 }),
      kick: new THREE.MeshStandardMaterial({ color: 0x3a3733, roughness: .9 }),
      top: new THREE.MeshStandardMaterial({ color: 0xf4f3ef, roughness: .35 }),
      handle: new THREE.MeshStandardMaterial({ color: 0x1b1b1b, roughness: .4, metalness: .4 }),
      glass: new THREE.MeshStandardMaterial({ color: 0x0c0c0e, roughness: .15, metalness: .3 }),
      steel: new THREE.MeshStandardMaterial({ color: 0xc4c8cc, roughness: .3, metalness: .85, side: THREE.DoubleSide }),
    };
    function box(w, h, d, mat, x, y, z, parent) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z); m.castShadow = m.receiveShadow = true;
      (parent || scene).add(m); return m;
    }

    // cabinet run: local x along run, front face at z = 26, back at z = 0
    const D = 26;
    function run(len, mods, group) {
      box(len, 30.5, D, M.cab, len / 2, 4 + 15.25, D / 2, group);
      box(len, 4, D - 3, M.kick, len / 2, 2, (D - 3) / 2, group);
      let x = 0;
      mods.forEach(m => {
        const w = m.w, cx = x + w / 2, fz = D + .375;
        if (m.t === 'drawers') {
          const h = 9.5;
          for (let i = 0; i < 3; i++) {
            const cy = 4.6 + h / 2 + i * (h + .25);
            box(w - .25, h, .75, M.door, cx, cy, fz, group);
            box(w - 3, h - 3, .3, M.panel, cx, cy, fz + .45, group);
            box(5, .5, .5, M.handle, cx, cy + h / 2 - 1.4, fz + 1.1, group);
          }
        } else {
          const doors = m.t === 'double' ? 2 : 1, dw = w / doors;
          for (let i = 0; i < doors; i++) {
            const dx = x + dw * i + dw / 2, h = 29.5;
            box(dw - .25, h, .75, M.door, dx, 4.6 + h / 2, fz, group);
            box(dw - 3, h - 3, .3, M.panel, dx, 4.6 + h / 2, fz + .45, group);
            const hx = doors === 2 ? (i === 0 ? dx + dw / 2 - 1.8 : dx - dw / 2 + 1.8) : dx + dw / 2 - 1.8;
            box(.5, 4, .5, M.handle, hx, 4.6 + h - 5, fz + 1.1, group);
          }
        }
        x += w;
      });
    }
    const topRun = new THREE.Group(); scene.add(topRun);
    run(116, [{ w: 15, t: 'door' }, { w: 15, t: 'door' }, { w: 15, t: 'drawers' }, { w: 15, t: 'drawers' }, { w: 15, t: 'door' }, { w: 15, t: 'door' }], topRun);
    const side = new THREE.Group(); scene.add(side);
    side.position.set(116, 0, 26); side.rotation.y = -Math.PI / 2;
    run(78, [{ w: 26, t: 'door' }, { w: 26, t: 'door' }, { w: 26, t: 'double' }], side);

    // countertop (L shape with cooktop and sink cut-outs)
    const shape = new THREE.Shape();
    [[0, 0], [116, 0], [116, 104], [84, 104], [84, 32], [0, 32]].forEach((p, i) => i ? shape.lineTo(p[0], p[1]) : shape.moveTo(p[0], p[1]));
    function hole(cx, cz, w, d) {
      const p = new THREE.Path();
      p.moveTo(cx - w / 2, cz - d / 2); p.lineTo(cx + w / 2, cz - d / 2); p.lineTo(cx + w / 2, cz + d / 2); p.lineTo(cx - w / 2, cz + d / 2); p.closePath();
      shape.holes.push(p);
    }
    const CK = { x: 30, z: 14, w: 24, d: 20 }, SK = { x: 100, z: 86, w: 16, d: 20 };
    hole(CK.x, CK.z, CK.w, CK.d); hole(SK.x, SK.z, SK.w, SK.d);
    const ct = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 1.5, bevelEnabled: false }), M.top);
    ct.rotation.x = Math.PI / 2; ct.position.y = 36;
    ct.castShadow = ct.receiveShadow = true; scene.add(ct);

    // backsplash tiles, 2 ft (24 in) high, 12 in square
    function tileMat(len) {
      const c = document.createElement('canvas'); c.width = 512; c.height = 256;
      const g = c.getContext('2d');
      for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) {
        const x0 = i * 128, y0 = j * 128, v = Math.floor(Math.random() * 18) - 9;
        g.fillStyle = `rgb(${118 + v},${115 + v},${111 + v})`; g.fillRect(x0, y0, 128, 128);
        for (let k = 0; k < 1100; k++) {
          const r = Math.random();
          g.fillStyle = r < .45 ? 'rgba(20,20,20,.55)' : r < .8 ? 'rgba(235,230,220,.5)' : r < .93 ? 'rgba(150,95,70,.5)' : 'rgba(70,70,75,.6)';
          const s = Math.random() * 2.2 + .4;
          g.fillRect(x0 + Math.random() * 128, y0 + Math.random() * 128, s, s);
        }
        g.fillStyle = '#2e2d2b'; g.fillRect(x0, y0, 128, 2.5); g.fillRect(x0, y0, 2.5, 128);
      }
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(len / 48, 1);
      t.anisotropy = 8;
      return new THREE.MeshStandardMaterial({ map: t, roughness: .25 });
    }
    const bs1 = new THREE.Mesh(new THREE.PlaneGeometry(116, 24), tileMat(116));
    bs1.position.set(58, 48, .02); bs1.receiveShadow = true; scene.add(bs1);
    const bs2 = new THREE.Mesh(new THREE.PlaneGeometry(104, 24), tileMat(104));
    bs2.rotation.y = -Math.PI / 2; bs2.position.set(115.98, 48, 52); bs2.receiveShadow = true; scene.add(bs2);

    // wall cabinets above the tile: 2.5 ft (30 in) high, 1 ft (12 in) deep, bottom at 60 in
    function wallRun(len, n, g) {
      box(len, 30, 12, M.cab, len / 2, 15, 6, g);
      const w = len / n;
      for (let i = 0; i < n; i++) {
        const cx = w * i + w / 2;
        // handle-less doors, hanging 1 in below the box (overlap door): spans -1 to 29.75
        box(w - .25, 30.75, .75, M.door, cx, 14.375, 12.375, g);
        box(w - 3, 27.75, .3, M.panel, cx, 14.375, 12.825, g);
      }
    }
    const wc1 = new THREE.Group(); wc1.position.set(0, 60, 0); scene.add(wc1);
    wallRun(116, 8, wc1);
    const wc2 = new THREE.Group(); wc2.position.set(116, 60, 12); wc2.rotation.y = -Math.PI / 2; scene.add(wc2);
    wallRun(92, 4, wc2);

    // top boxes above the wall cabinets: same 30 in height, 15 in deep, bottom at 90 in
    function loftRun(len, n, g) {
      const d = 15;
      box(len, 30, d, M.cab, len / 2, 15, d / 2, g);
      const w = len / n;
      for (let i = 0; i < n; i++) {
        const cx = w * i + w / 2;
        // handle-less doors, hanging 1 in below the box (overlap door): spans -1 to 29.75
        box(w - .25, 30.75, .75, M.door, cx, 14.375, d + .375, g);
        box(w - 3, 27.75, .3, M.panel, cx, 14.375, d + .825, g);
      }
    }
    const lf1 = new THREE.Group(); lf1.position.set(0, 90, 0); scene.add(lf1);
    loftRun(116, 8, lf1);
    const lf2 = new THREE.Group(); lf2.position.set(116, 90, 15); lf2.rotation.y = -Math.PI / 2; scene.add(lf2);
    loftRun(89, 4, lf2);

    // cooktop
    box(CK.w, .5, CK.d, M.glass, CK.x, 35.9, CK.z);
    [[-5.5, -4.5, 2.4], [5.5, -4.5, 2.4], [-5.5, 4.5, 2.4], [5.5, 4.5, 2.4]].forEach(([dx, dz, r]) => {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(r, .35, 8, 24), M.steel);
      ring.rotation.x = Math.PI / 2; ring.position.set(CK.x + dx, 36.4, CK.z + dz); scene.add(ring);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, .5, 16), M.handle);
      cap.position.set(CK.x + dx, 36.3, CK.z + dz); scene.add(cap);
      box(9, .3, .4, M.handle, CK.x + dx, 36.8, CK.z + dz); box(.4, .3, 9, M.handle, CK.x + dx, 36.8, CK.z + dz);
    });
    for (let i = 0; i < 4; i++) {
      const k = new THREE.Mesh(new THREE.CylinderGeometry(.6, .6, .5, 12), M.steel);
      k.position.set(CK.x - 6 + i * 4, 36.1, CK.z + CK.d / 2 - 1.5); scene.add(k);
    }

    // sink basin and faucet
    const bd = 8, sy = 36 - bd / 2;
    box(SK.w, .2, SK.d, M.steel, SK.x, 36 - bd, SK.z);
    box(SK.w, bd, .2, M.steel, SK.x, sy, SK.z - SK.d / 2); box(SK.w, bd, .2, M.steel, SK.x, sy, SK.z + SK.d / 2);
    box(.2, bd, SK.d, M.steel, SK.x - SK.w / 2, sy, SK.z); box(.2, bd, SK.d, M.steel, SK.x + SK.w / 2, sy, SK.z);
    const drain = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, .1, 20), M.handle);
    drain.position.set(SK.x, 36 - bd + .2, SK.z); scene.add(drain);
    const fx = 112.5, fz = SK.z;
    const curve = new THREE.CatmullRomCurve3([[fx, 36, fz], [fx, 46, fz], [fx - 1, 50, fz], [fx - 5, 50, fz], [fx - 8, 48, fz], [fx - 8, 44, fz]].map(a => new THREE.Vector3(...a)));
    const faucet = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, .7, 10), M.steel);
    faucet.castShadow = true; scene.add(faucet);
    box(.4, .4, 3, M.steel, fx, 36.6, fz + 2.5).rotation.z = 0;

    // dimension annotations
    const dimGroup = new THREE.Group(); scene.add(dimGroup);
    const lineMat = new THREE.LineBasicMaterial({ color: dark ? 0xe0dccf : 0x333333 });
    function seg(a, b) { dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]), lineMat)); }
    function label(txt, pos) {
      const c = document.createElement('canvas'); c.width = 512; c.height = 128;
      const g = c.getContext('2d');
      g.fillStyle = dark ? 'rgba(42,44,47,.92)' : 'rgba(251,250,247,.94)';
      g.fillRect(0, 0, 512, 128);
      g.strokeStyle = dark ? '#8fb4c6' : '#3b5b6b'; g.lineWidth = 4; g.strokeRect(2, 2, 508, 124);
      g.fillStyle = dark ? '#ece8e0' : '#23211e'; g.font = '600 52px Helvetica, Arial, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, 256, 66);
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
      s.scale.set(26, 6.5, 1); s.position.set(...pos); s.renderOrder = 10; dimGroup.add(s);
    }
    function dim(a, b, txt, tickDir) {
      seg(a, b);
      [a, b].forEach(p => seg([p[0] - tickDir[0], p[1], p[2] - tickDir[2]], [p[0] + tickDir[0], p[1], p[2] + tickDir[2]]));
      label(txt, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + 1, (a[2] + b[2]) / 2]);
    }
    dim([0, .2, -10], [84, .2, -10], '7\u2032-0\u2033 (84\u2033)', [0, 0, 2]);
    dim([129, .2, 32], [129, .2, 104], '6\u2032-0\u2033 (72\u2033)', [2, 0, 0]);
    dim([-10, .2, 0], [-10, .2, 32], '2\u2032-8\u2033 (32\u2033)', [2, 0, 0]);
    dim([84, .2, 113], [116, .2, 113], '2\u2032-8\u2033 (32\u2033)', [0, 0, 2]);
    label('Cooktop zone', [CK.x, 128, CK.z]);
    seg([-6, 36, 0], [-6, 60, 0]); seg([-8, 36, 0], [-4, 36, 0]); seg([-8, 60, 0], [-4, 60, 0]);
    label('Tiles 2\u2032-0\u2033 (24\u2033)', [-20, 48, 0]);
    seg([-6, 60, 0], [-6, 90, 0]); seg([-8, 90, 0], [-4, 90, 0]);
    label('Upper 2\u2032-6\u2033 H', [-20, 76, 0]);
    label('Depth 1\u2032-0\u2033', [-20, 68, 0]);
    seg([-6, 90, 0], [-6, 120, 0]); seg([-8, 120, 0], [-4, 120, 0]);
    label('Top 2\u2032-6\u2033 H', [-20, 106, 0]);
    label('Depth 1\u2032-3\u2033', [-20, 98, 0]);
    label('Sink zone', [SK.x - 6, 46, SK.z + 12]);

    // cabinet colour options
    const palettes = [
      { n: 'Taupe', cab: 0x8c8578, door: 0x9a9386, panel: 0x867f72 },
      { n: 'Sage green', cab: 0x6f7f6b, door: 0x7d8d78, panel: 0x697863 },
      { n: 'Navy blue', cab: 0x2f4258, door: 0x3b5068, panel: 0x2a3b4f },
      { n: 'Warm white', cab: 0xdcd8cf, door: 0xe8e4db, panel: 0xd3cec3 },
    ];
    const swBox = document.getElementById('sw');
    palettes.forEach((p, i) => {
      const b = document.createElement('button');
      b.title = p.n; b.setAttribute('aria-label', p.n);
      b.style.background = '#' + p.door.toString(16).padStart(6, '0');
      b.onclick = () => {
        M.cab.color.setHex(p.cab); M.door.color.setHex(p.door); M.panel.color.setHex(p.panel);
        [...swBox.children].forEach(x => x.classList.toggle('on', x === b));
      };
      if (i === 0) b.classList.add('on');
      swBox.appendChild(b);
    });

    // camera views
    const views = {
      persp: [[175, 125, 225], [58, 16, 52]],
      top: [[58, 320, 52.1], [58, 0, 52]],
      front: [[58, 25, 320], [58, 18, 50]],
      side: [[340, 25, 52], [58, 18, 52]],
    };
    let anim = null;
    function go(k) {
      const [p, t] = views[k]; anim = { p: new THREE.Vector3(...p), t: new THREE.Vector3(...t), n: 0 };
      document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === k));
    }
    document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));
    camera.position.set(...views.persp[0]);
    document.querySelector('[data-v=persp]').classList.add('on');
    document.getElementById('spin').onclick = e => { controls.autoRotate = !controls.autoRotate; e.target.classList.toggle('on', controls.autoRotate); };
    document.getElementById('dims').onclick = e => { dimGroup.visible = !dimGroup.visible; e.target.classList.toggle('on', dimGroup.visible); };
    controls.autoRotateSpeed = 1.2;

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    (function loop() {
      requestAnimationFrame(loop);
      if (anim) {
        anim.n += .06; const a = Math.min(anim.n, 1), e = a * a * (3 - 2 * a);
        camera.position.lerp(anim.p, e * .25 + .05); controls.target.lerp(anim.t, e * .25 + .05);
        if (anim.n > 1.5) anim = null;
      }
      controls.update(); renderer.render(scene, camera);
    })();
  </script>
</body>

</html>
